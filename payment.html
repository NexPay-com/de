<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
<title>NexPay — Bank Transfer</title>
<meta name="theme-color" content="#ffffff"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --pri: #0052ff;
    --pri2: #10b981;
    --text: #0f172a;
    --text-dim: #64748b;
  }

  * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  
  /* Desktop-friendly adjustments: allow scrolling on body/html for web layout */
  html, body { min-height: 100%; margin: 0; background-color: var(--bg); }

  body {
    color: var(--text);
  }

  .shell { 
    display: flex; 
    flex-direction: column; 
    min-height: 100vh; 
    max-width: 600px; 
    margin: 0 auto; 
    background: var(--bg);
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.05);
  }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(15px); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 1000; flex-shrink: 0;
  }

  .title { font-weight: 800; font-size: 16px; color: var(--text); }
  .badge { padding: 4px 12px; border-radius: 100px; background: #ecfdf5; border: 1px solid #a7f3d0; color: #059669; font-size: 12px; font-weight: 700; }

  main { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 16px; width: 100%; margin: 0 auto; }

  .card {
    background: var(--card);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    display: flex; flex-direction: column; gap: 16px;
  }

  .detail-box { background: #f1f5f9; border-radius: 14px; padding: 16px; margin: 0; border: 1px solid var(--border); }
  .row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
  .row:last-child { margin-bottom: 0; }
  .mut { color: var(--text-dim); font-weight: 600; }

  .timer-wrap { text-align: center; margin-bottom: 0; }
  .timer { font-size: 28px; font-weight: 800; color: var(--text); letter-spacing: 1px; }

  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    font-weight: 700; font-size: 15px; cursor: pointer;
    background: var(--pri);
    color: #fff; transition: transform 0.1s, background 0.2s; margin-bottom: 0;
    box-shadow: 0 4px 12px rgba(0, 82, 255, 0.2);
  }
  .btn:active { transform: scale(0.97); }

  .btn-ghost {
    width: 100%; padding: 12px; border-radius: 12px;
    background: transparent; border: 1px solid var(--border);
    color: var(--text); font-weight: 700; font-size: 14px; cursor: pointer;
    transition: background 0.2s;
  }
  .btn-ghost:hover { background: #f1f5f9; }

  /* CHAT SECTION */
  #contactBox { display: none; flex-direction: column; gap: 10px; margin-top: 10px; }
  .chat {
    background: #f1f5f9; border-radius: 16px;
    border: 1px solid var(--border); height: 320px; display: flex; flex-direction: column; overflow: hidden;
  }
  .chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  .msg { max-width: 80%; padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.4; position: relative; }
  .me { align-self: flex-end; background: var(--pri); color: #fff; border-bottom-right-radius: 4px; font-weight: 600; }
  .you { align-self: flex-start; background: #e2e8f0; color: var(--text); border-bottom-left-radius: 4px; }

  .chat-input { display: flex; gap: 6px; padding: 10px; background: #ffffff; border-top: 1px solid var(--border); align-items: center; flex-wrap: nowrap; }
  .chat-input input[type="text"] { min-width: 0; flex: 1; background: #f1f5f9; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); outline: none; font-size: 13px; }
  .chat-input input[type="text"]:focus { border-color: var(--pri); background: #ffffff; }

  .upl-btn { background: #f1f5f9; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--pri); font-weight: 700; font-size: 12px; cursor: pointer; display: flex; align-items: center; white-space: nowrap; flex-shrink: 0; }

  /* Highly Visible and Flex-Shrink Protected Send Button */
  #sendBtn {
    background: #10b981;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 800;
    font-size: 13px;
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    transition: background 0.2s, transform 0.1s;
  }
  #sendBtn:hover { background: #059669; }
  #sendBtn:active { transform: scale(0.97); }

  footer {
    padding: 14px 24px calc(14px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, 0.95); border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: center; flex-shrink: 0;
  }
  .fitem { 
    color: var(--text-dim); text-decoration: none; font-size: 12px; font-weight: 700; 
    display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.2s; 
  }
  .fitem .market-logo { font-size: 20px; line-height: 20px; font-weight: 800; display: inline-block; }
  .fitem svg { width: 22px; height: 22px; fill: currentColor; }
  .fitem.active { color: var(--pri); }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="title">Bank Transfer</div>
    <div class="badge" id="stageBadge">Awaiting Payment</div>
  </header>

  <main>
    <section class="card">
      <div class="timer-wrap">
        <div class="mut" style="font-size: 12px; margin-bottom: 4px;">TIME REMAINING</div>
        <div class="timer" id="timer">00:00</div>
      </div>

      <div class="detail-box">
        <div class="row"><span class="mut">Amount to Pay</span><strong id="amt" style="color: var(--pri); font-size: 18px;">₦0</strong></div>
        <div class="row"><span class="mut">Bank Name</span><strong>SmartCash PSB</strong></div>
        <div class="row"><span class="mut">Account Name</span><strong>OLADUNNI MUFTAU</strong></strong></div>
        <div class="row" style="flex-direction: column; gap: 8px;">
          <span class="mut">Account Number:</span>
          <div style="background: #ffffff; padding: 12px; border-radius: 10px; border: 1px dashed var(--pri); text-align: center; font-size: 18px; font-weight: 800; letter-spacing: 0.5px; color: var(--text);">
            082 175 4030
          </div>
          <span style="font-size: 11px; color: var(--text-dim); text-align: center; font-style: italic;">* Transfer exact amount to the account details above</span>
        </div>
      </div>

      <div id="instr" style="font-size: 13px; color: var(--text-dim); text-align: center; margin-bottom: 2px;">Send the exact amount and upload your receipt.</div>

      <button class="btn" id="btnComplete">I Have Paid</button>
      <div style="display: flex; gap: 10px;">
        <button class="btn-ghost" id="btnCancel" style="flex: 1;">Cancel</button>
        <button class="btn-ghost" id="toggleChatBtn" style="flex: 2;">Chat with Seller</button>
      </div>

      <div id="contactBox">
        <div class="chat">
          <div id="chatLog" class="chat-log"></div>
          <div class="chat-input">
            <label class="upl-btn" for="img">Attach</label>
            <input id="img" type="file" accept="image/*" style="display:none"/>
            <input id="text" type="text" placeholder="Send a message..."/>
            <button id="sendBtn">Send</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <a class="fitem" href="p2p.html">
      <span class="market-logo">⇄</span>
      Market
    </a>
    <a class="fitem" href="order.html">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      Orders
    </a>
  </footer>
</div>

<script>
/* Logical script preserved exactly from your structure */
const STAGES={MAKE:'make_payment',WAIT_CONFIRM:'await_seller_confirm',UPLOAD_RECEIPT:'await_receipt',REVIEW:'await_review_after_receipt',DONE:'done',BANNED:'banned'};
const fmt=n=>'₦'+Number(n).toLocaleString();
const logEl=document.getElementById('chatLog');
const timerEl=document.getElementById('timer');
const badgeEl=document.getElementById('stageBadge');
const instrEl=document.getElementById('instr');

let order=JSON.parse(localStorage.getItem('currentP2POrder')||'null');
if(!order){location.href='p2p.html';}
document.getElementById('amt').textContent=fmt(order.amount);

function save(){localStorage.setItem('currentP2POrder',JSON.stringify(order));}

function renderChat(){
  logEl.innerHTML='';
  (order.messages||[]).forEach(m=>{
    const d=document.createElement('div');
    d.className='msg '+(m.who==='me'?'me':'you');
    if(m.type==='img'){
      d.innerHTML=`<img src="${m.data}" style="max-width:100%; border-radius:10px; display:block"/><div style="font-size:10px; margin-top:4px; opacity:0.7;">${new Date(m.at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>`;
    }else{
      d.innerHTML=`${m.text}<div style="font-size:10px; margin-top:4px; opacity:0.7;">${new Date(m.at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>`;
    }
    logEl.appendChild(d);
  });
  logEl.scrollTop=logEl.scrollHeight;
}
renderChat();

function maybeAutoReply(){
  if(!order.autoReplyScheduled){
    order.autoReplyScheduled = true;
    setTimeout(()=>{
      order.messages.push({who:'you', type:'text', text:'Drop receipt', at:Date.now()});
      save(); renderChat();
    }, 28000);
  }
}

document.getElementById('sendBtn').onclick=()=>{
  const t=document.getElementById('text');
  if(!t.value.trim())return;
  order.messages.push({who:'me', type:'text', text:t.value.trim(), at:Date.now()});
  save(); renderChat(); t.value=''; maybeAutoReply();
};

document.getElementById('img').onchange=(e)=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    order.messages.push({who:'me', type:'img', data:rd.result, at:Date.now()});
    save(); renderChat(); maybeAutoReply();
  }; rd.readAsDataURL(f);
};

function updateUI(){
  const btnC=document.getElementById('btnComplete');
  const btnX=document.getElementById('btnCancel');
  if(order.stage===STAGES.MAKE){
    badgeEl.textContent='Make Payment';
    btnC.style.display='block'; btnX.style.display='block';
  } else {
    btnC.style.display='none'; btnX.style.display='none';
    if(order.stage===STAGES.WAIT_CONFIRM) badgeEl.textContent='Verifying...';
    if(order.stage===STAGES.UPLOAD_RECEIPT) {
        badgeEl.textContent='Action Required';
        instrEl.style.color = "#ef4444";
        instrEl.textContent = "Confirmation failed. Upload receipt now.";
    }
    if(order.stage===STAGES.REVIEW) badgeEl.textContent='Under Review';
    if(order.stage===STAGES.BANNED) {
        badgeEl.textContent='Suspended';
        instrEl.textContent = "Account restricted due to policy violation.";
    }
  }
}
updateUI();

function tick(){
  if(order.stageEndAt){
    const left=order.stageEndAt-Date.now();
    if(left<=0){
      if(order.stage===STAGES.MAKE){
        localStorage.removeItem('currentP2POrder'); location.href='p2p.html'; return;
      }else if(order.stage===STAGES.WAIT_CONFIRM){
        order.stage=STAGES.UPLOAD_RECEIPT; order.stageEndAt=null; save(); updateUI();
      }else if(order.stage===STAGES.REVIEW){
        localStorage.setItem('p2pBanned','true'); order.stage=STAGES.BANNED; save(); updateUI();
      }
    }
    const d = new Date(left);
    timerEl.textContent=left>0?d.toISOString().substr(14,5):'00:00';
  }
  setTimeout(tick, 1000);
}
tick();

document.getElementById('btnComplete').onclick=()=>{
    order.stage=STAGES.WAIT_CONFIRM;
    order.stageEndAt=Date.now() + 30*60*1000;
    save(); updateUI();
};
document.getElementById('btnCancel').onclick=()=>{ localStorage.removeItem('currentP2POrder'); location.href='p2p.html'; };

document.getElementById('toggleChatBtn').onclick=()=>{
  const box=document.getElementById('contactBox');
  box.style.display=box.style.display==='flex'?'none':'flex';
  if(box.style.display==='flex') logEl.scrollTop=logEl.scrollHeight;
};

// Monitor for receipt upload in "Upload Receipt" stage
const obs=new MutationObserver(()=>{
  if(order.stage===STAGES.UPLOAD_RECEIPT && (order.messages||[]).some(m=>m.type==='img')){
    order.stage=STAGES.REVIEW;
    // order.stageEndAt=Date.now() + 60*60*1000;
    save(); updateUI();
  }
});
obs.observe(logEl, {childList:true});
</script>
</body>
</html>
